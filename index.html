<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموقع الرسمي لعائلة سامي احميدان ابو لحية</title>
    
    <!-- استدعاء الخط العربي الفخم بشكل آمن -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <style>
        html { scroll-behavior: smooth; }
        body { 
            margin: 0; 
            padding: 20px 10px; 
            background-color: #0d0d0d; 
            color: #ffffff; 
            font-family: 'Amiri', serif; 
            text-align: center; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-sizing: border-box;
        }
        
        .header-title { 
            color: #d4af37; 
            font-size: calc(1.8rem + 1vw); /* حجم خط مرن يتكيف مع حجم الشاشة */
            margin: 5px 0; 
            font-weight: 700; 
            text-shadow: 0 4px 12px rgba(212, 175, 55, 0.2); 
        }
        
        .header-subtitle { 
            color: #b3b3b3; 
            font-size: calc(1rem + 0.3vw); 
            margin-top: 0; 
            margin-bottom: 25px; 
        }

        /* حاوية الأزرار الرئيسية */
        .main-nav-buttons { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 12px; 
            max-width: 900px; 
            margin: 0 auto 20px auto; 
        }

        /* تنسيق الأزرار الذهبية الملكية للتناسب مع الهواتف */
        .btn-royal-gold { 
            display: inline-block; 
            color: #d4af37; 
            text-decoration: none; 
            border: 2px solid #d4af37; 
            padding: 8px 20px; 
            font-weight: bold; 
            font-size: 1rem;
            border-radius: 4px; 
            transition: all 0.3s ease; 
            background: transparent;
            min-width: 140px;
            box-sizing: border-box;
        }
        
        .btn-royal-gold:hover { 
            color: #0d0d0d; 
            background: #d4af37; 
            box-shadow: 0 0 15px rgba(212,175,55,0.5); 
            transform: translateY(-2px);
        }

        /* حاوية زر الاتصال السفلي */
        .call-btn-container {
            margin: 20px auto; 
            text-align: center; 
            clear: both; 
            display: block; 
            width: 100%;
        }

        /* تنسيقات إضافية مخصصة لشاشات الجوال الصغيرة جداً */
        @media (max-width: 480px) {
            body { padding: 10px 5px; }
            .main-nav-buttons { gap: 8px; }
            .btn-royal-gold { width: 90%; font-size: 0.95rem; padding: 8px 10px; }
        }
    </style>
</head>
<body>

    <!-- شعار العائلة العلوي -->
    <div style="font-size: 2.5rem; margin-bottom: 5px;">⚜️</div>
    <h1 class="header-title">الموقع الرسمي لعائلة</h1>
    <p class="header-subtitle">سامي احميدان ابو لحية</p>

    <!-- الأزرار الخمسة الأساسية المنسقة والمصلحة -->
    <div class="main-nav-buttons">
        <a href="tree.html#sons-section" class="btn-royal-gold">🌳 شجرة العائلة والذرية</a>
        <a href="#" class="btn-royal-gold">📜 ديوان العائلة</a>
        <a href="memories.html" class="btn-royal-gold">📸 صندوق الذاكرة</a>
        <a href="quiz.html" class="btn-royal-gold">🕌 المسابقة الإسلامية</a>
        <a href="kids.html" class="btn-royal-gold">🎈 لعبة أطفال العائلة</a>
    </div>

    <!-- زر الاتصال المباشر المصلح والمحمي بالأسفل -->
    <div class="call-btn-container">
        <a href="https://jit.si" target="_blank" class="btn-royal-gold" style="padding: 10px 30px; font-size: 1.1rem; background-color: rgba(212,175,55,0.05); border-color: #e5c158; color: #e5c158;">
            📞 دخول مجلس العائلة المباشر (صوت وفيديو)
        </a>
    </div>

</body>
</html>
