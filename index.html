<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الموقع الرسمي لعائلة سامي احميدان ابو لحية</title>
    
    <!-- استدعاء الخط العربي الفخم بشكل آمن ومكتمل الروابط -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <style>
        html, body { 
            scroll-behavior: smooth; 
            margin: 0; 
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh; /* التكيف الديناميكي مع شاشات الهواتف ومتصفحاتها لمنع التمدد واختفاء الأزرار */
            overflow: hidden; /* منع ظهور أشرطة التمرير تماماً لإجبار المحتوى على البقاء داخل الشاشة */
            background-color: #0d0d0d; 
            box-sizing: border-box;
        }
        
        body { 
            padding: 12px 8px; 
            color: #ffffff; 
            font-family: 'Amiri', serif; 
            text-align: center; 
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* توزيع متناسق: الشعار بالأعلى، الأزرار بالمنتصف، زر الاتصال بالأسفل */
            align-items: center;
        }

        /* حاوية لتجميع المحتوى العلوي والشعار */
        .top-section {
            width: 100%;
            margin-top: 5px;
        }
        
        .header-title { 
            color: #d4af37; 
            font-size: calc(1.5rem + 1vw); 
            margin: 5px 0; 
            font-weight: 700; 
            text-shadow: 0 4px 12px rgba(212, 175, 55, 0.2); 
        }
        
        .header-subtitle { 
            color: #b3b3b3; 
            font-size: calc(0.9rem + 0.3vw); 
            margin-top: 0; 
            margin-bottom: 5px; 
        }

        /* حاوية الأزرار الرئيسية المرنة */
        .main-nav-buttons { 
            display: flex; 
            flex-direction: column; /* ترتيب طولي ذكي وموفر للمساحة ومضمون لظهور كل الأزرار على الجوال */
            justify-content: center; 
            align-items: center;
            gap: 8px; 
            width: 100%;
            max-width: 400px;
            margin: auto 0;
        }

        /* تنسيق الأزرار الذهبية الملكية للتناسب الكامل مع أصابع اليد على الهواتف */
        .btn-royal-gold { 
            display: inline-block; 
            color: #d4af37; 
            text-decoration: none; 
            border: 2px solid #d4af37; 
            padding: 8px 10px; 
            font-weight: bold; 
            font-size: 0.9rem;
            border-radius: 4px; 
            transition: all 0.3s ease; 
            background: transparent;
            width: 90%; /* امتداد متناسق لسهولة الضغط */
            box-sizing: border-box;
        }
        
        .btn-royal-gold:hover { 
            color: #0d0d0d; 
            background: #d4af37; 
            box-shadow: 0 0 15px rgba(212,175,55,0.5); 
        }

        /* حاوية زر الاتصال السفلي ليبقى ملتصقاً بالأسفل دائماً ومرئياً */
        .call-btn-container {
            width: 100%;
            margin-bottom: 5px;
            padding: 5px 0;
        }
    </style>
</head>
<body>

    <!-- الجزء العلوي المحتوي على الشعار والعنوان -->
    <div class="top-section">
        <div style="font-size: 2rem; margin-bottom: 2px;">⚜️</div>
        <h1 class="header-title">الموقع الرسمي لعائلة</h1>
        <p class="header-subtitle">سامي احميدان ابو لحية</p>
    </div>

    <!-- الأزرار الخمسة الأساسية المرتبة طولياً بشكل يضمن بقاءها داخل الشاشة تماماً -->
    <div class="main-nav-buttons">
        <a href="tree.html#sons-section" class="btn-royal-gold">🌳 شجرة العائلة والذرية</a>
        <a href="#" class="btn-royal-gold">📜 ديوان العائلة</a>
        <a href="memories.html" class="btn-royal-gold">📸 صندوق الذاكرة</a>
        <a href="quiz.html" class="btn-royal-gold">🕌 المسابقة الإسلامية</a>
        <a href="kids.html" class="btn-royal-gold">🎈 لعبة أطفال العائلة</a>
    </div>

    <!-- زر الاتصال المباشر السفلي المعدل والمصلح الرابط تماماً والمضمون ظهوره -->
     <!-- زر مجلس العائلة المباشر عبر سيرفرات جوجل المستقرة والآمنة -->

    <!-- زر مجلس العائلة المباشر برابط حقيقي فعال 100% عبر سيرفرات جوجل ميت المستقرة -->
            <a href="call.html" class="btn-royal-gold" style="padding: 12px 25px; font-size: 1.05rem; background-color: rgba(212,175,55,0.05); border-color: #e5c158; color: #e5c158; width: 90%; max-width: 360px; display: inline-block; text-decoration: none;">دخول مجلس العائلة المباشر (صوت وفيديو)</a>

            📞 دخول مجلس العائلة المباشر (صوت وفيديو)
        </a>
    </div>
<!-- نافذة الدردشة الخاصة بموقعي -->
<div class="chat-container">
    <div class="chat-header" onclick="toggleChat()">
        <span>💬 دردشة الموقع</span>
        <strong id="chat-toggle-icon">▲</strong>
    </div>
    <div class="chat-content" id="chatContent">
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">مرحباً بك في موقعنا! كيف يمكنني مساعدتك اليوم؟</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="اكتب رسالتك هنا..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">إرسال</button>
        </div>
    </div>
</div>

<!-- ربط كود التشغيل الخاص بالدردشة -->
<script src="chat.js"></script>

</body>
</html>
