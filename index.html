<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الموقع الرسمي لعائلة سامي احميدان ابو لحية</title>
    
    <!-- استدعاء الخط العربي الفخم بشكل آمن -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <style>
        html { 
            scroll-behavior: smooth; 
        }
        body { 
            margin: 0; 
            padding: 10px; 
            background-color: #0d0d0d; 
            color: #ffffff; 
            font-family: 'Amiri', serif; 
            text-align: center; 
            min-height: 100vh;
            min-height: 100dvh; /* يتكيف تلقائياً مع شاشات الهواتف ومتصفحاتها */
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* توزيع العناصر بشكل متساوٍ لضمان بقاء الأزرار داخل الشاشة */
            align-items: center;
            box-sizing: border-box;
        }

        /* حاوية لتجميع المحتوى العلوي والشعار */
        .top-section {
            width: 100%;
            margin-top: auto;
            margin-bottom: 15px;
        }
        
        .header-title { 
            color: #d4af37; 
            font-size: calc(1.6rem + 1vw); 
            margin: 5px 0; 
            font-weight: 700; 
            text-shadow: 0 4px 12px rgba(212, 175, 55, 0.2); 
        }
        
        .header-subtitle { 
            color: #b3b3b3; 
            font-size: calc(0.95rem + 0.3vw); 
            margin-top: 0; 
            margin-bottom: 15px; 
        }

        /* حاوية الأزرار الرئيسية المرنة */
        .main-nav-buttons { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 10px; 
            max-width: 800px; 
            width: 100%;
            margin: 0 auto;
        }

        /* تنسيق الأزرار الذهبية الملكية للتناسب الكامل مع أصابع اليد على الهواتف */
        .btn-royal-gold { 
            display: inline-block; 
            color: #d4af37; 
            text-decoration: none; 
            border: 2px solid #d4af37; 
            padding: 8px 16px; 
            font-weight: bold; 
            font-size: 0.95rem;
            border-radius: 4px; 
            transition: all 0.3s ease; 
            background: transparent;
            min-width: 140px;
            box-sizing: border-box;
        }
        
        .btn-royal-gold:hover { 
            color: #0d0d0d; 
            background: #d4af37; 
            box-shadow: 0 0 15px rgba(212,175,55,0.5); 
        }

        /* حاوية زر الاتصال السفلي ليبقى ملتصقاً بالأسفل دائماً */
        .call-btn-container {
            width: 100%;
            margin-top: auto;
            margin-bottom: auto;
            padding: 15px 0;
        }

        /* تعديلات شاشات الجوال لترتيب الأزرار بشكل طولي عند صغر حجم الشاشة جداً */
        @media (max-width: 480px) {
            body { padding: 15px 10px; }
            .main-nav-buttons { 
                flex-direction: column;
                align-items: center;
                gap: 8px; 
            }
            .btn-royal-gold { 
                width: 85%; 
                font-size: 0.9rem; 
                padding: 10px; 
            }
        }
    </style>
</head>
<body>

    <!-- الجزء العلوي المحتوي على الشعار والعنوان -->
    <div class="top-section">
        <div style="font-size: 2.2rem; margin-bottom: 2px;">⚜️</div>
        <h1 class="header-title">الموقع الرسمي لعائلة</h1>
        <p class="header-subtitle">سامي احميدان ابو لحية</p>
    </div>

    <!-- الأزرار الخمسة الأساسية المنسقة والجاهزة للاستخدام -->
    <div class="main-nav-buttons">
        <a href="tree.html#sons-section" class="btn-royal-gold">🌳 شجرة العائلة والذرية</a>
        <a href="#" class="btn-royal-gold">📜 ديوان العائلة</a>
        <a href="memories.html" class="btn-royal-gold">📸 صندوق الذاكرة</a>
        <a href="quiz.html" class="btn-royal-gold">🕌 المسابقة الإسلامية</a>
        <a href="kids.html" class="btn-royal-gold">🎈 لعبة أطفال العائلة</a>
    </div>

    <!-- زر الاتصال المباشر السفلي المضمون ظهوره في الأسفل دون اختفاء -->
    <div class="call-btn-container">
        <a href="https://jit.si" target="_blank" class="btn-royal-gold" style="padding: 10px 30px; font-size: 1.05rem; background-color: rgba(212,175,55,0.05); border-color: #e5c158; color: #e5c158; width: auto; min-width: 200px;">
            📞 دخول مجلس العائلة المباشر (صوت وفيديو)
        </a>
    </div>

</body>
</html>
