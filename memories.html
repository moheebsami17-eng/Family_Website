<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>صندوق الذاكرة - عائلة سامي حميدان أبو لحية</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        h1 {
            color: #ffc107;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(255, 193, 7, 0.3);
        }
        .gallery-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        .gallery-item {
            background-color: #111;
            border: 2px solid #ffc107;
            border-radius: 10px;
            overflow: hidden;
            width: 280px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .gallery-item:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 193, 7, 0.5);
        }
        .gallery-item img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }
        .back-btn {
            display: inline-block;
            margin-top: 40px;
            padding: 12px 30px;
            background-color: transparent;
            color: #ffc107;
            border: 2px solid #ffc107;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }
        .back-btn:hover {
            background-color: #ffc107;
            color: #000;
        }
    </style>
</head>
<body>

    <h1>📸 صندوق الذاكرة العائلية (100 ذكرى)</h1>
    
    <!-- هذه الحاوية سيتم ملؤها بـ 100 صورة تلقائياً بواسطة الكود الذكي بالأسفل -->
    <div class="gallery-container" id="familyGallery"></div>

    <br>
    <a href="index.html" class="back-btn">⬅️ العودة للموقع الرسمي</a>

    <!-- الكود الذكي لتوليد 100 صورة بدون تعب -->
    <script>
        const gallery = document.getElementById('familyGallery');
        
        // نصيحة: أسهل طريقة هي إعادة تسمية صورك في المجلد من 1 إلى 100
        // هذا الكود يفترض أن أسماء صورك هي: 1.jpg, 2.jpg, 3.jpg ... حتى 100.jpg
        for (let i = 1; i <= 100; i++) {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            
            const img = document.createElement('img');
            img.src = `images/${i}.jpg`; // مسار الصورة تلقائياً
            img.alt = `ذكرى عائلية رقم ${i}`;
            
            // في حال لم تكن الصورة موجودة أو هناك نقص في الأرقام، لن تظهر أيقونة مكسورة بل سيتم تخطيها
            img.onerror = function() {
                this.parentElement.style.display = 'none';
            };
            
            item.appendChild(img);
            gallery.appendChild(item);
        }
    </script>

</body>
</html>
