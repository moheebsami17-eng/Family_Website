<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المسابقة الثقافية الإسلامية الكبرى | ديوان العائلة</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 40px 10px;
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Amiri', serif;
            text-align: center;
        }
        .quiz-container {
            background: linear-gradient(145deg, #111, #161616);
            border: 2px solid #d4af37;
            max-width: 650px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
        }
        .quiz-title {
            color: #d4af37;
            font-size: 2.3rem;
            margin-bottom: 5px;
            text-shadow: 0 4px 10px rgba(212, 175, 55, 0.2);
        }
        .quiz-subtitle {
            color: #b3b3b3;
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 25px;
        }
        .progress-bar-container {
            width: 100%;
            background-color: #222;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
            border: 1px solid rgba(212,175,55,0.2);
        }
        .progress-bar {
            height: 10px;
            width: 0%;
            background-color: #d4af37;
            transition: width 0.3s ease;
        }
        .question-counter {
            font-size: 1.1rem;
            color: #b3b3b3;
            margin-bottom: 10px;
            text-align: right;
        }
        .question-box {
            font-size: 1.5rem;
            margin-bottom: 20px;
            min-height: 60px;
            font-weight: 700;
            text-align: right;
            line-height: 1.6;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }
        .option-btn {
            background: rgba(255,255,255,0.03);
            color: #ffffff;
            border: 1px solid rgba(212,175,55,0.3);
            padding: 12px 20px;
            font-size: 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            text-align: right;
            font-family: 'Amiri', serif;
            transition: all 0.2s;
        }
        .option-btn:hover {
            border-color: #d4af37;
            background: rgba(212,175,55,0.05);
            transform: translateX(-4px);
        }
        .option-btn.correct {
            background-color: #27ae60 !important;
            border-color: #2ecc71 !important;
            color: white;
        }
        .option-btn.wrong {
            background-color: #c0392b !important;
            border-color: #e74c3c !important;
            color: white;
        }
        .score-box {
            font-size: 1.8rem;
            color: #d4af37;
            font-weight: bold;
            display: none;
        }
        .back-btn {
            display: inline-block;
            margin-top: 25px;
            color: #d4af37;
            text-decoration: none;
            border: 2px solid #d4af37;
            padding: 8px 25px;
            font-weight: bold;
            border-radius: 4px;
            transition: all 0.3s;
        }
        .back-btn:hover {
            color: #0d0d0d;
            background: #d4af37;
        }
    </style>
    
    <!-- استدعاء ملف الأسئلة الخارجي بأمان -->
    <script src="quizData.js"></script>
</head>
<body>

    <div class="quiz-container">
        <h1 class="quiz-title">🕌 المسابقة الإسلامية الكبرى</h1>
        <p class="quiz-subtitle">تحدي الـ 50 سؤالاً الثقافي في ديوان العائلة</p>

        <!-- منطقة اللعب النشطة -->
        <div id="game-card">
            <div class="question-counter" id="counter-text">السؤال: 1 / 50</div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-indicator"></div>
            </div>
            <div class="question-box" id="question-text">جاري تحميل السؤال الأول...</div>
            <div class="options-list" id="options-container"></div>
        </div>

        <!-- شاشة النتيجة النهائية -->
        <div id="result-card" class="score-box">
            <p>🎉 تهانينا عائلتنا المباركة! أتممتم التحدي كاملًا 🎉</p>
            <p id="final-score">نتيجتك هي: 0 من 50</p>
            <button onclick="location.reload()" class="back-btn" style="cursor:pointer; background:none; font-family:'Amiri';">إعادة التحدي 🔄</button>
        </div>

        <br>
        <a href="index.html" class="back-btn">← العودة للرئيسية</a>
    </div>

    <!-- محرك التحكم باللعبة -->
    <script>
        var currentQuestionIndex = 0;
        var score = 0;

        function loadQuestion() {
            var optionsContainer = document.getElementById('options-container');
            var counterText = document.getElementById('counter-text');
            var progressIndicator = document.getElementById('progress-indicator');
            var questionText = document.getElementById('question-text');

            if (!quizData || quizData.length === 0) {
                questionText.innerText = "❌ فشل تحميل ملف الأسئلة الخارجي. تأكد من وجود ملف quizData.js بجانب هذا الملف.";
                return;
            }

            optionsContainer.innerHTML = "";
            var currentQuestion = quizData[currentQuestionIndex];
            
            counterText.innerText = "السؤال: " + (currentQuestionIndex + 1) + " / " + quizData.length;
            progressIndicator.style.width = ((currentQuestionIndex / quizData.length) * 100) + "%";
            questionText.innerText = currentQuestion.question;

            currentQuestion.options.forEach(function(option, index) {
                var button = document.createElement('button');
                button.innerText = option;
                button.classList.add('option-btn');
                button.onclick = function() { checkAnswer(index, button); };
                optionsContainer.appendChild(button);
            });
        }

        function checkAnswer(selectedIndex, clickedButton) {
            var currentQuestion = quizData[currentQuestionIndex];
            var optionsContainer = document.getElementById('options-container');
            var buttons = optionsContainer.getElementsByClassName('option-btn');

            if (selectedIndex === currentQuestion.correct) {
                clickedButton.classList.add('correct');
                score++;
            } else {
                clickedButton.classList.add('wrong');
                if (buttons[currentQuestion.correct]) {
                    buttons[currentQuestion.correct].classList.add('correct');
                }
            }

            setTimeout(function() {
                currentQuestionIndex++;
                if (currentQuestionIndex < quizData.length) {
                    loadQuestion();
                } else {
                    document.getElementById('game-card').style.display = 'none';
                    document.getElementById('result-card').style.display = 'block';
                    document.getElementById('progress-indicator').style.width = "100%";
                    document.getElementById('final-score').innerText = "نتيجتك العائلية هي: " + score + " من " + quizData.length;
                }
            }, 1000);
        }

        // تشغيل اللعبة فوراً
        loadQuestion();
    </script>
</body>
</html>
