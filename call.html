<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل اتصال العائلة</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
            color: #333;
        }
        .contacts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
        }
        .contact-card {
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 20px;
            text-align: center;
            position: relative;
        }
        .avatar-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background-color: #eee;
        }
        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .status-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 3px solid #fff;
            z-index: 2;
        }
        .status-online { background-color: #2ecc71; }
        .status-busy { background-color: #e74c3c; }
        .status-offline { background-color: #95a5a6; }

        .name {
            font-size: 1.3rem;
            font-weight: bold;
            margin: 10px 0 5px;
            color: #2c3e50;
        }
        .relation {
            font-size: 0.9rem;
            color: #7f8c8d;
            background: #ecf0f1;
            padding: 3px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 5px;
        }
        .phone-display {
            font-size: 0.95rem;
            color: #34495e;
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .status-text {
            font-size: 0.9rem;
            margin-bottom: 15px;
            display: block;
            color: #555;
        }
        /* تصميم الزر الجديد بنظام النسخ الفوري */
        .copy-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .copy-btn:hover {
            background-color: #0056b3;
        }
        .copy-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>📞 دليل اتصال العائلة</h1>
            <p>انقر على الزر لنسخ رقم الهاتف ومراسلته فوراً</p>
        </div>

        <div class="contacts-grid" id="contactsContainer"></div>
    </div>

    <!-- كود جلب السكريبت المحدث المانع للـ Cache -->
    <script src="contacts.js?v=3"></script>

    <script>
        // دالة جافاسكريبت لنسخ الرقم وعرض التنبيه الفوري للمستخدم دون الانتقال لصفحات خارجية
        function copyNumber(number, name) {
            navigator.clipboard.writeText(number).then(() => {
                alert("📋 تم نسخ رقم " + name + " بنجاح!\nالرقم هو: " + number + "\nيمكنك الآن الانتقال لواتساب ولصق الرقم لمراسلته.");
            }).catch(err => {
                alert("حدث خطأ أثناء النسخ، الرقم هو: " + number);
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("contactsContainer");

            if (typeof newFamilyContacts !== 'undefined' && newFamilyContacts.length > 0) {
                newFamilyContacts.forEach(contact => {
                    
                    let statusClass = 'status-offline';
                    let statusTxt = 'غير متصل';
                    
                    if (contact.status === 'online') {
                        statusClass = 'status-online';
                        statusTxt = 'متصل الآن';
                    } else if (contact.status === 'busy') {
                        statusClass = 'status-busy';
                        statusTxt = 'مشغول';
                    }

                    const card = document.createElement("div");
                    card.className = "contact-card";
                    
                    card.innerHTML = '\
                        <div class="avatar-container">\
                            <img src="' + contact.avatar + '" class="avatar" onerror="this.src=\'https://placeholder.com\'">\
                            <span class="status-dot ' + statusClass + '"></span>\
                        </div>\
                        <div class="name">' + contact.name + '</div>\
                        <span class="relation">' + contact.relation + '</span>\
                        <span class="phone-display">📱 ' + contact.phone + '</span>\
                        <span class="status-text">' + statusTxt + '</span>\
                        <button onclick="copyNumber(\'' + contact.phone + '\', \'' + contact.name + '\')" class="copy-btn">\
                            <span>📋 نسخ الرقم للواتساب</span>\
                        </button>';
                    
                    container.appendChild(card);
                });
            } else {
                container.innerHTML = "<p style='text-align:center;'>جاري تحديث دليل العائلة الجديد...</p>";
            }
        });
    </script>
</body>
</html>
