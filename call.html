<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة الاتصال المباشر</title>
    
    <style>
        body {
            margin: 0; padding: 0; background-color: #000000; color: #ffffff;
            font-family: sans-serif; text-align: center; height: 100vh;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        /* شبكة عرض الفيديو المباشر داخل الصفحة */
        .video-grid {
            flex: 1; display: flex; flex-wrap: wrap; justify-content: center;
            align-items: center; gap: 15px; padding: 20px;
        }
        .video-box {
            width: 45%; min-width: 280px; height: 320px; background: #111;
            border: 2px solid #d4af37; border-radius: 8px; position: relative;
            overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        .user-tag {
            position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.7);
            color: #d4af37; padding: 4px 10px; border-radius: 4px; font-size: 0.85rem; z-index: 10;
        }
        /* لوحة التحكم السفلية لإغلاق المكالمة */
        .controls {
            padding: 20px; background: #0a0a0a; border-top: 1px solid #222;
            display: flex; justify-content: center;
        }
        .btn-end {
            background: #ff4d4d; color: #fff; border: none;
            padding: 12px 40px; font-size: 1.1rem; font-weight: bold;
            border-radius: 4px; cursor: pointer; transition: all 0.2s;
        }
        .btn-end:hover { background: #cc0000; box-shadow: 0 0 15px rgba(255,77,77,0.4); }
    </style>

    <!-- استدعاء السكريبت الرسمي والمحمي من سيرفرات Agora RTC لتشغيل الكاميرا أونلاين -->
    <script src="https://agora.io"></script>
</head>
<body>

    <!-- منطقة عرض بث الكاميرات المباشرة -->
    <div class="video-grid" id="video-streams">
        <div class="video-box" id="local-player-wrapper">
            <div id="local-player" style="width:100%; height:100%;"></div>
            <div class="user-tag">بثك المباشر (أنت)</div>
        </div>
    </div>

    <!-- زر إنهاء المكالمة والمغادرة -->
    <div class="controls">
        <button class="btn-end" onclick="leaveCall()">🔴 إنهاء المكالمة ومغادرة المجلس</button>
    </div>

    <script>
        // إعدادات الاتصال الدائمة والمفتوحة مجاناً لكم عبر سيرفر Agora الآمن
        const options = {
            appId: "c89b970f5e144a9f8f26dbd5b24479e3", // معرف التطبيق المجاني الخاص بكم
            channel: "Sami_Family_Council_2026", // اسم الغرفة المشترك ليلتقي فيه الجميع تلقائياً
            token: null,
            uid: null
        };

        let rtc = {
            client: null,
            localAudioTrack: null,
            localVideoTrack: null
        };

        async function startCall() {
            // 1. إنشاء عميل الاتصال
            rtc.client = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });

            // 2. الاستماع لدخول الطرف الآخر وعرض بثه تلقائياً فور دخوله موقعك
            rtc.client.on("user-published", async (user, mediaType) => {
                await rtc.client.subscribe(user, mediaType);
                if (mediaType === "video") {
                    const remoteVideoTrack = user.videoTrack;
                    const remotePlayerContainer = document.createElement("div");
                    remotePlayerContainer.id = user.uid.toString();
                    remotePlayerContainer.className = "video-box";
                    remotePlayerContainer.innerHTML = `<div style="width:100%; height:100%;" id="vid-${user.uid}"></div><div class="user-tag">طرف آخر متصل بالبث</div>`;
                    document.getElementById("video-streams").appendChild(remotePlayerContainer);
                    remoteVideoTrack.play(`vid-${user.uid}`);
                }
                if (mediaType === "audio") {
                    user.audioTrack.play();
                }
            });

            // حذف شاشة الفيديو تلقائياً عند خروج الطرف الآخر
            rtc.client.on("user-unpublished", user => {
                const remotePlayerContainer = document.getElementById(user.uid.toString());
                if (remotePlayerContainer) remotePlayerContainer.remove();
            });

            // 3. الانضمام الفعلي وفتح الكاميرا والمايكروفون الخاص بجهازك
            try {
                options.uid = await rtc.client.join(options.appId, options.channel, options.token, null);
                
                rtc.localAudioTrack = await AgoraRTC.createMicrophoneAudioTrack();
                rtc.localVideoTrack = await AgoraRTC.createCameraVideoTrack();
                
                // عرض الكاميرا الخاصة بك داخل المربع الأسود الخاص بك
                rtc.localVideoTrack.play("local-player");
                
                // نشر البث أونلاين لكي يراك ويسمعك الطرف الآخر فوراً
                await rtc.client.publish([rtc.localAudioTrack, rtc.localVideoTrack]);
            } catch (error) {
                console.error("خطأ في تشغيل الكاميرا: ", error);
                alert("يرجى السماح للمتصفح باستخدام الكاميرا والمايكروفون لبدء البث.");
            }
        }

        async function leaveCall() {
            if(rtc.localAudioTrack) rtc.localAudioTrack.close();
            if(rtc.localVideoTrack) rtc.localVideoTrack.close();
            
            const remoteContainers = document.querySelectorAll(".video-box:not(#local-player-wrapper)");
            remoteContainers.forEach(container => container.remove());
            
            if(rtc.client) await rtc.client.leave();
            window.location.href = "index.html"; // يعود للرئيسية بعد الإغلاق
        }

        // تشغيل نظام الاتصال تلقائياً بمجرد فتح الصفحة
        window.onload = function() {
            startCall();
        };
    </script>
</body>
</html>
