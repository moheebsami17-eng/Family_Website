<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجلس العائلة الرقمي - اتصال فيديو وصوت</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Amiri', serif;
            text-align: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .call-header {
            padding: 20px;
            background: #141414;
            border-bottom: 2px solid #d4af37;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .call-header h1 {
            color: #d4af37;
            margin: 0 0 5px 0;
            font-size: 2rem;
        }

        .back-btn {
            display: inline-block;
            margin-top: 10px;
            color: #d4af37;
            text-decoration: none;
            border: 1px solid #d4af37;
            padding: 5px 15px;
            border-radius: 4px;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: #d4af37;
            color: #0d0d0d;
        }

        #meet-container {
            flex: 1;
            width: 100%;
            background: #000;
        }

        .setup-box {
            margin: auto;
            padding: 30px;
            background: #141414;
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 8px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        .setup-box input {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            background: #222;
            border: 1px solid #d4af37;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
            text-align: center;
            font-size: 1.1rem;
        }

        .start-btn {
            background: #d4af37;
            color: #0d0d0d;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
        }

        .start-btn:hover {
            background: #fff;
            box-shadow: 0 0 15px rgba(212,175,55,0.6);
        }
    </style>
    
    <!-- السكريبت المحدث والمحمي رسمياً لتخطي جدار حماية المتصفحات أونلاين -->
    <script src="https://unpkg.com"></script>
</head>
<body>

    <div class="call-header">
        <h1>🎙️ مجلس عائلة أبو لحية الرقمي</h1>
        <p style="margin: 0; color: #b3b3b3;">تواصل صوتي ومرئي مباشر ومشفر ومغلق للعائلة فقط</p>
        <a href="index.html" class="back-btn">← العودة للرئيسية</a>
    </div>

    <div id="setup-area" style="display: flex; flex: 1;">
        <div class="setup-box">
            <h3 style="color: #d4af37; margin-top: 0;">مرحباً بك في المجلس</h3>
            <label for="username">أدخل اسمك الكريم للانضمام:</label>
            <input type="text" id="username" placeholder="مثال: ابنكم وائل" required>
            <button class="start-btn" onclick="startCall()">دخول المجلس وتفعيل الكاميرا</button>
        </div>
    </div>

    <div id="meet-container" style="display: none;"></div>

    <script>
        function startCall() {
            const username = document.getElementById('username').value.trim();
            if (username === "") {
                alert("من فضلك أدخل اسمك أولاً ليعرف أفراد العائلة من يتحدث.");
                return;
            }

            document.getElementById('setup-area').style.display = 'none';
            document.getElementById('meet-container').style.display = 'block';

            // غرفة مخصصة فريدة لعائلتك المباركة
            const roomName = "Sami_Ahmeidan_Abuliah_Family_2026"; 

            const domain = "meet.jit.si";
            const options = {
                roomName: roomName,
                width: "100%",
                height: "100%",
                parentNode: document.getElementById("meet-container"),
                userInfo: {
                    displayName: username
                },
                configOverwrite: {
                    startWithAudioMuted: false,
                    startWithVideoMuted: false,
                    defaultLanguage: "ar"
                },
                interfaceConfigOverwrite: {
                    TOOLBAR_BUTTONS: ['microphone', 'camera', 'chat', 'hangup', 'tileview']
                }
            };

            const api = new JitsiMeetExternalAPI(domain, options);
        }
    </script>
</body>
</html>
