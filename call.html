<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجلس العائلة الرقمي - اتصال مباشر فيديو وصوت</title>
    
    <!-- استدعاء خط Amiri المتناسق مع هوية موقعك -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0; padding: 0; background-color: #0d0d0d; color: #ffffff;
            font-family: 'Amiri', serif; text-align: center; height: 100vh;
            display: flex; flex-direction: column; box-sizing: border-box;
        }
        .call-header {
            padding: 15px; background: #141414; border-bottom: 2px solid #d4af37;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .call-header h1 { color: #d4af37; margin: 0 0 5px 0; font-size: 1.8rem; }
        
        /* واجهة إدخال الاسم قبل تفعيل الكاميرا */
        .setup-box {
            margin: auto; padding: 35px; background: #141414;
            border: 1px solid rgba(212,175,55,0.3); border-radius: 8px;
            max-width: 400px; width: 90%; box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        .setup-box input {
            width: 100%; padding: 12px; margin: 20px 0; background: #222;
            border: 1px solid #d4af37; color: white; border-radius: 4px;
            box-sizing: border-box; text-align: center; font-size: 1.1rem; font-family: 'Amiri', serif;
        }
        
        /* شبكة عرض شاشات الفيديو المباشر */
        .video-grid {
            flex: 1; display: flex; flex-wrap: wrap; justify-content: center;
            align-items: center; gap: 20px; padding: 25px; background: #000;
        }
        .video-box {
            width: 45%; min-width: 290px; height: 320px; background: #111;
            border: 2px solid #d4af37; border-radius: 8px; position: relative;
            overflow: hidden; box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }
        .user-tag {
            position: absolute; bottom: 12px; right: 12px; background: rgba(0,0,0,0.7);
            color: #d4af37; padding: 5px 12px; border-radius: 4px; font-size: 0.9rem; z-index: 10;
        }
        
        /* لوحة الأزرار السفلية */
        .controls {
            padding: 20px; background: #141414; border-top: 1px solid rgba(212,175,55,0.2);
            display: flex; justify-content: center; gap: 20px;
        }
        .btn {
            background: transparent; color: #d4af37; border: 2px solid #d4af37;
            padding: 10px 30px; font-family: 'Amiri', serif; font-size: 1.1rem;
            font-weight: bold; border-radius: 4px; cursor: pointer; transition: all 0.3s;
            text-decoration: none;
        }
        .btn:hover { color: #0d0d0d; background: #d4af37; box-shadow: 0 0 15px rgba(212,175,55,0.5); }
        .btn-danger { color: #ff4d4d; border-color: #ff4d4d; }
        .btn-danger:hover { color: #fff; background: #ff4d4d; box-shadow: 0 0 15px rgba(255,77,77,0.5); }
    </style>

    <!-- استدعاء سكريبت بروتوكول الاتصال المباشر المحدث لحل مشاكل الشاشة السوداء -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div class="call-header">
        <h1>🎙️ مجلس عائلة أبو لحية المباشر</h1>
        <p style="margin: 0; color: #b3b3b3; font-size: 0.95rem;">برنامج اتصال خاص ومستقل بالصوت والصورة داخل الموقع</p>
    </div>

    <!-- واجهة الدخول قبل بدء المكالمة -->
    <div id="setup-area" style="display: flex; flex: 1;">
        <div class="setup-box">
            <h3 style="color: #d4af37; margin-top: 0; font-size: 1.4rem;">مرحباً بك في مجلس العائلة</h3>
            <label for="username" style="color: #ccc;">أدخل اسمك الكريم للانضمام للبث البصري:</label>
            <input type="text" id="username" placeholder="مثال: ابنكم مهيب" required>
            <button class="btn" style="width: 100%;" onclick="startCall()">دخول وتفعيل الكاميرا والمايك</button>
        </div>
    </div>

    <!-- شبكة عرض بث كاميرات أفراد العائلة (تظهر بعد إدخال الاسم) -->
    <div class="video-grid" id="video-streams" style="display: none;">
        <div class="video-box" id="local-player-wrapper">
            <div id="local-player" style="width:100%; height:100%;"></div>
            <div class="user-tag" id="local-tag">أنت</div>
        </div>
    </div>

    <div class="controls" id="controls-area" style="display: none;">
        <button class="btn btn-danger" onclick="leaveCall()">🔴 إنهاء المكالمة والمغادرة</button>
        <a href="index.html" class="btn">🏠 القائمة الرئيسية</a>
    </div>

    <script>
        // إعدادات البث الآمنة والدائمة المخصصة الحصرية لمشروع عائلتكم
        const options = {
            appId: "931215b5e7d54b429d38fa2e0d37e6f8", 
            channel: "Sami_Ahmeidan_Family_Private_Room_2026", 
            token: null, 
            uid: null
        };

        let rtc = {
            client: null,
            localAudioTrack: null,
            localVideoTrack: null
        };

        async function startCall() {
            const username = document.getElementById('username').value.trim();
            if (username === "") {
                alert("من فضلك أدخل اسمك الكريم أولاً ليعرف أفراد العائلة من يتصل.");
                return;
            }

            // تحديث بطاقة الاسم الخاصة بك
            document.getElementById('local-tag').innerText = username + " (أنت)";
            
            // تبديل الواجهات بصرياً
            document.getElementById('setup-area').style.display = 'none';
            document.getElementById('video-streams').style.display = 'flex';
            document.getElementById('controls-area').style.display = 'flex';

            // 1. إنشاء عميل الاتصال وضبط تشفير البث
            rtc.client = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });

            // 2. الاستماع اللحظي والمباشر لدخول أي قريب من جهاز آخر وعرض كاميرته فوراً بجانبك
            rtc.client.on("user-published", async (user, mediaType) => {
                await rtc.client.subscribe(user, mediaType);
                if (mediaType === "video") {
                    const remoteVideoTrack = user.videoTrack;
                    
                    // منع تكرار النوافذ عند إعادة التحميل
                    let existBox = document.getElementById(user.uid.toString());
                    if (existBox) existBox.remove();

                    const remotePlayerContainer = document.createElement("div");
                    remotePlayerContainer.id = user.uid.toString();
                    remotePlayerContainer.className = "video-box";
                    remotePlayerContainer.innerHTML = `<div style="width:100%; height:100%;" id="vid-${user.uid}"></div><div class="user-tag">أحد أفراد العائلة متصل الآن</div>`;
                    document.getElementById("video-streams").appendChild(remotePlayerContainer);
                    remoteVideoTrack.play(`vid-${user.uid}`);
                }
                if (mediaType === "audio") {
                    user.audioTrack.play();
                }
            });

            // مسح إطار الفيديو تلقائياً لأي فرد يغادر المكالمة
            rtc.client.on("user-unpublished", user => {
                const remotePlayerContainer = document.getElementById(user.uid.toString());
                if (remotePlayerContainer) remotePlayerContainer.remove();
            });

            // 3. الربط الفعلي بالسيرفر وتشغيل الكاميرا والميكروفون الخاص بجهازك
            try {
                options.uid = await rtc.client.join(options.appId, options.channel, options.token, null);
                
                rtc.localAudioTrack = await AgoraRTC.createMicrophoneAudioTrack();
                rtc.localVideoTrack = await AgoraRTC.createCameraVideoTrack();
                
                // بدء عرض الكاميرا الخاصة بك داخل المربع الذهبي
                rtc.localVideoTrack.play("local-player");
                
                // نشر البث أونلاين لكي تظهر وتُسمع عند بقية الأجهزة فوراً
                await rtc.client.publish([rtc.localAudioTrack, rtc.localVideoTrack]);
            } catch (error) {
                console.error("خطأ في تشغيل العتاد: ", error);
                alert("يرجى التأكد من الضغط على 'سماح' أو 'Allow' لإذن الكاميرا والمايك في متصفحك لكي يبدأ الاتصال بنجاح.");
            }
        }

        async function leaveCall() {
            if(rtc.localAudioTrack) rtc.localAudioTrack.close();
            if(rtc.localVideoTrack) rtc.localVideoTrack.close();
            
            const remoteContainers = document.querySelectorAll(".video-box:not(#local-player-wrapper)");
            remoteContainers.forEach(container => container.remove());
            
            if(rtc.client) await rtc.client.leave();
            window.location.href = "index.html"; // العودة للرئيسية عند الإغلاق
        }
    </script>
</body>
</html>
