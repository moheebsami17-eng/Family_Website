<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل اتصال العائلة</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
            color: #333;
        }
        .contacts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
        }
        .contact-card {
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 20px;
            text-align: center;
            position: relative;
            transition: transform 0.3s ease;
        }
        .contact-card:hover {
            transform: translateY(-5px);
        }
        .avatar-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background-color: #eee;
        }
        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .status-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 2;
        }
        .status-online { background-color: #2ecc71; }
        .status-busy { background-color: #e74c3c; }
        .status-offline { background-color: #95a5a6; }

        .name {
            font-size: 1.3rem;
            font-weight: bold;
            margin: 10px 0 5px;
            color: #2c3e50;
        }
        .relation {
            font-size: 0.9rem;
            color: #7f8c8d;
            background: #ecf0f1;
            padding: 3px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 12px;
        }
        .status-text {
            font-size: 0.9rem;
            margin-bottom: 15px;
            display: block;
            color: #555;
        }
        /* تنسيق الزر التفاعلي الجديد */
        .call-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #25D366;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .call-btn:hover {
            background-color: #128C7E;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>📞 دليل اتصال العائلة</h1>
            <p>تواصل مع أفراد عائلتك بسرعة عبر واتساب</p>
        </div>

        <div class="contacts-grid" id="contactsContainer"></div>
    </div>

    <script src="callData.js"></script>

    <script>
        // دالة مخصصة وحاسمة تفتح الرابط بأمر نافذة منبثقة مستقلة للتخلص من أي قراءة خاطئة للمتصفح
        function openWhatsApp(phoneNumber) {
            // تنظيف الرقم تماماً من الرموز والمسافات
            let clean = phoneNumber.replace(/[\s+\-]/g, '');
            
            // إذا كان الرقم يبدأ بالصفر، نحوله للمفتاح الدولي الافتراضي لفلسطين كما ظهر في صورتك السابقة (970)
            if (clean.startsWith('0')) {
                clean = '970' + clean.substring(1); 
            }
            
            // بناء الرابط الصريح والشامل مع البروتوكول الآمن لضمان التوجيه
            const finalUrl = "https://whatsapp.com" + clean;
            
            // فتح الرابط بشكل منبثق إجباري
            window.open(finalUrl, '_blank');
        }

        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("contactsContainer");

            if (typeof familyContacts !== 'undefined' && familyContacts.length > 0) {
                familyContacts.forEach(contact => {
                    
                    let statusClass = '';
                    let statusTxt = '';
                    
                    if (contact.status === 'online') {
                        statusClass = 'status-online';
                        statusTxt = 'متصل الآن';
                    } else if (contact.status === 'busy') {
                        statusClass = 'status-busy';
                        statusTxt = 'مشغول';
                    } else {
                        statusClass = 'status-offline';
                        statusTxt = 'غير متصل';
                    }

                    const card = document.createElement("div");
                    card.className = "contact-card";
                    
                    // هنا نستخدم زر عادي يقوم باستدعاء دالة الجافاسكريبت المباشرة بدلاً من وسم الرابط href القديم
                    card.innerHTML = '\
                        <div class="avatar-container">\
                            <img src="' + contact.avatar + '" alt="' + contact.name + '" class="avatar" onerror="this.src=\'https://placeholder.com\'">\
                            <span class="status-dot ' + statusClass + '"></span>\
                        </div>\
                        <div class="name">' + contact.name + '</div>\
                        <span class="relation">' + contact.relation + '</span>\
                        <span class="status-text">' + statusTxt + '</span>\
                        <button onclick="openWhatsApp(\'' + contact.phone + '\')" class="call-btn">\
                            <span>💬 مراسلة واتساب</span>\
                        </button>';
                    
                    container.appendChild(card);
                });
            } else {
                container.innerHTML = "<p style='text-align:center; grid-column: 1/-1;'>عذراً، لم يتم العثور على بيانات اتصال.</p>";
            }
        });
    </script>
</body>
</html>
