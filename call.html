<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجلس عائلة أبو لحية الرقمي</title>
    
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0d0d0d; overflow: hidden;
            font-family: sans-serif; display: flex; flex-direction: column;
        }
        .call-header {
            padding: 12px; background: #141414; border-bottom: 2px solid #d4af37;
            text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .call-header h1 { color: #d4af37; margin: 0 0 4px 0; font-size: 1.6rem; }
        
        /* حاوية تشغيل غرفة الاتصال بالكامل داخل موقعك */
        .iframe-container {
            flex: 1; width: 100%; height: 100%; background: #000; border: none;
        }
        .controls {
            padding: 15px; background: #141414; text-align: center;
            border-top: 1px solid rgba(212,175,55,0.2);
        }
        .btn {
            background: #ff4d4d; color: #fff; border: none; padding: 10px 35px;
            font-size: 1rem; font-weight: bold; border-radius: 4px; cursor: pointer;
            text-decoration: none; display: inline-block; transition: all 0.2s;
        }
        .btn:hover { background: #cc0000; box-shadow: 0 0 15px rgba(255,77,77,0.4); }
    </style>
</head>
<body>

    <div class="call-header">
        <h1>🎙️ مجلس عائلة أبو لحية المباشر</h1>
        <p style="margin: 0; color: #b3b3b3; font-size: 0.9rem;">غرفة اتصال مشفرة ومفتوحة على مدار الساعة للعائلة</p>
    </div>

    <!-- 🎯 الإطار السحري الذي يتخطى قيود كروم ويشغل الكاميرا والصوت فوراً بين الأجهزة -->
    <iframe 
        class="iframe-container"
        src="https://whereby.com" 
        allow="camera; microphone; fullscreen; speaker; display-capture"
    ></iframe>

    <div class="controls">
        <a href="index.html" class="btn">🔴 إنهاء المكالمة والعودة للرئيسية</a>
    </div>

</body>
</html>
